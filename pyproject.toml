[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sdjwt-offline"
version = "0.1.0"
description = "Zero-network IETF RFC 9901 Selective-Disclosure JWT (SD-JWT) issuer/verifier, W3C Bitstring Status List offline revocation bitmaps, and compact QR credential toolkit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "sd-jwt",
    "verifiable-credentials",
    "digital-identity",
    "selective-disclosure",
    "privacy",
    "offline-first",
    "revocation",
    "qr-code",
    "w3c",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
sdjwt-offline = "sdjwt_offline.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/sdjwt-offline"
Repository = "https://github.com/codesphere-u/sdjwt-offline"
Issues = "https://github.com/codesphere-u/sdjwt-offline/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sdjwt_offline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sdjwt_offline"]
